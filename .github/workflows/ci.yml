# Local-only repo: this file is provided for when a remote exists. Nothing is pushed.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked deps (clean env)
        run: |
          uv venv .venv --python ${{ matrix.python-version }}
          uv pip sync --python .venv/bin/python requirements.lock
          uv pip install --python .venv/bin/python --no-deps -e .
      - name: Tests
        run: .venv/bin/python -m pytest -q
      - name: Offline synthetic smoke demo
        run: .venv/bin/vms demo --out /tmp/vms_demo --seed 42
      - name: PIT snapshot on synthetic data
        run: .venv/bin/vms build-snapshot --input /tmp/vms_demo/data --ticker SYN000001.SZ --as-of 2024-05-15 --out /tmp/vms_snap
      - name: Deterministic projection on synthetic data
        run: .venv/bin/vms project --input /tmp/vms_demo/data --ticker SYN000001.SZ --as-of 2025-06-30 --out /tmp/vms_proj
      - name: Regimes + driver distributions on synthetic data
        run: .venv/bin/vms estimate --input /tmp/vms_demo/data --ticker SYN000001.SZ --as-of 2025-06-30 --out /tmp/vms_est
      - name: Correlated path simulation on synthetic data
        run: .venv/bin/vms simulate --input /tmp/vms_demo/data --ticker SYN000001.SZ --as-of 2025-06-30 --out /tmp/vms_sim --paths 200 --years 3
      - name: Path-wise statements on synthetic data
        run: .venv/bin/vms project-paths --input /tmp/vms_demo/data --ticker SYN000001.SZ --as-of 2025-06-30 --out /tmp/vms_fp --paths 100 --years 3
      - name: DCF valuation on synthetic data
        run: .venv/bin/vms value --input /tmp/vms_demo/data --ticker SYN000001.SZ --as-of 2025-06-30 --out /tmp/vms_val --paths 100 --years 3
      - name: Entry-price returns on synthetic data
        run: .venv/bin/vms returns --input /tmp/vms_demo/data --ticker SYN000001.SZ --as-of 2025-06-30 --out /tmp/vms_ret --paths 100 --years 3 --horizons 1,3
      - name: Sensitivity attribution on prior run
        run: .venv/bin/vms sensitivity --run-dir /tmp/vms_ret --out /tmp/vms_sens --paths 50 --years 3
      - name: Leakage mutation check
        run: PY=.venv/bin/python scripts/leakage_mutation_check.sh
      - name: Invariant mutation check
        run: PY=.venv/bin/python scripts/invariant_mutation_check.sh
