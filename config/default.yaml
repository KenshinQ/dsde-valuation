# VMS-0.2 default configuration (Phase 2 profile classifier + method registry (Phase 0–1 retained)).
# Phase 0 validates every field below. Fields marked "(Phase N)" are not consumed
# until that VMS-0.2 phase is implemented. Numeric values are explicit ASSUMPTIONS,
# not calibrated estimates. Legacy 0.1 modules may still read these keys.
configuration_version: "vms-default-0.2.phase2"
method_registry_file: method_registry.yaml   # relative to this file; empty registry OK
router_file: router.yaml
profiles_file: profiles.yaml
mode: production            # production | exploratory (exploratory overrides must be recorded)
base_currency: CNY          # internal normalisation currency (only CNY allowed)
timezone: Asia/Shanghai     # display/run-context tz. Date-only as_of rule is ASOF-DATE-CLOSE-v1 (15:00 CST), see vms.pit.asof
driver_profile: driver_profiles/operating_company.yaml   # relative to this file
horizons_years: [1, 3, 5]

monte_carlo:
  default_paths: 10000
  default_seed: 42
  max_invalid_path_fraction: 0.05
  correlation_prior_strength: 5.0      # shrink residual correlations toward I
  min_correlation_years: 5
  artifact_path_cap: 500               # full paths beyond this live only in paths.parquet

entry_price_grid:                      # (Phase 7) multipliers of spot price
  relative_to_spot: [0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3]

terminal_value:                        # (Phase 6)
  min_wacc_minus_g: 0.01               # require WACC - g >= this margin
  max_terminal_growth: 0.04            # ASSUMPTION: long-run nominal growth bound
  tv_fraction_warning: 0.75            # warn when TV/EV exceeds this
  terminal_growth: 0.03                # Gordon g (ASSUMPTION)

valuation:                             # (Phase 6) WACC / multiple / bridge — RF REQUIRED
  risk_free_rate: 0.025                # LABELED ASSUMPTION for offline/synthetic; PIT 10y CGB adapter later
  erp: 0.06
  beta: 1.0                            # explicit; shrink formula used when beta_n_eff > 0
  beta_prior: 1.0
  beta_shrink_strength: 2.0
  beta_n_eff: 0.0
  cost_of_equity: null                 # optional override
  cost_of_debt: null                   # null => use path/driver cost_of_debt
  tax_rate: null                       # null => use path/driver effective_tax_rate
  target_debt_weight: null             # null => snapshot market structure when use_snapshot_capital_structure
  target_equity_weight: null
  use_snapshot_capital_structure: true
  lease_debt_like: 0.0
  other_senior_claims: 0.0
  minority_interest_book: null
  exit_multiple:
    metric: ebitda
    multiple: 8.0                      # used when peers empty
    peers: []
    shrink_prior: 8.0
    shrink_strength: 2.0
    normalize_years: 1
  composite_weights: null              # keep DCF and exit-multiple separate

returns:                               # (Phase 7)
  loss_thresholds: [-0.4, -0.2]
  hurdles: [0.0, 0.08, 0.15]
  cvar_levels: [0.95, 0.99]

quality:                               # (Phase 1) integrity-gate thresholds — explicit assumptions
  balance_sheet_rel_tol: 0.005         # |total_assets - total_liabilities - total_equity| / total_assets
  share_change_rel_tol: 0.01           # share-count change not explained by known corporate actions
  adj_factor_rel_tol: 0.001            # vendor adjusted/raw factor jump not at a known action ex-date
  unit_jump_ratio: 100                 # >=100x jump between versions / consecutive stock periods
  max_capex_to_revenue: 5.0            # same-period capex/revenue above this => suspected unit error
  late_publication_days: 120           # A-share annual deadline is Apr 30 (~120d after FY end)
  require_industry_classification: true  # INDUSTRY-UNCLASSIFIED-v2: production BLOCK; exploratory override => generic

industry:                              # (Phase 2) INDUSTRY-SW-L1-v1 — labeled assumption
  scheme: SW2021_L1                    # Shenwan 2021 level-1 names
  unsupported: [银行, 非银金融]          # => UNSUPPORTED_PROFILE (generic FCFF/EV inappropriate)
  caution: [房地产, 公用事业]            # supported, flagged PROFILE_CAUTION (presales / regulated returns)
  profile_map: {}                      # industry -> dedicated registered profile (none implemented)
  default_profile: operating_company

projection:                            # (Phase 2) deterministic central case
  default_years: 5
  driver_history_years: 5
  min_history_years: 3
  statutory_tax_rate: 0.25             # TAX-CN-STATUTORY-25-v1
  tax_loss_carryforward_years: 5       # TAX-CN-LCF-5Y-v1
  min_cash_to_revenue: 0.05            # REVOLVER-MIN-CASH-v1
  invariant_abs_tol: 1.0               # CNY yuan
  revolver_spread: 0.0                 # REVOLVER-RATE-v1: revolver rate = cost_of_debt + spread
  cash_interest_rate: 0.0              # CASH-INTEREST-ZERO-v1: no interest income on cash (conservative)
  bs_residual_warn_ratio: 0.05         # BS-RESIDUAL-WARN-v1

capital_allocation:                    # (Phase 2) versioned policies (spec §10)
  default_policy: conservative_baseline
  policies:
    conservative_baseline: {version: "1"}          # payout driver; no buyback/acquisition/issuance; debt flat
    historical_continuation: {version: "1"}        # historical payout/buyback/acquisition/debt-to-revenue
    fixed_payout: {version: "1", payout_ratio: 0.30}
    target_leverage: {version: "1", debt_to_ebitda_min: 0.5, debt_to_ebitda_max: 2.5}
    min_cash_excess_distribution: {version: "1", min_cash_to_revenue: 0.15, dividend_share: 0.5}

regimes:                               # (Phase 3) fundamental regimes — PIT fundamentals only, never returns
  model: rule_based                    # rule_based | hmm (hmm = interface only, NOT IMPLEMENTED)
  model_version: "1"
  states: [GROWTH, STABLE, DETERIORATING, RECOVERY]   # subset allowed; dropped states merge into STABLE
  rules:                               # REGIME-RULES-v1 placeholders (not calibrated)
    growth_high: 0.10                  # TTM revenue growth yoy
    growth_low: 0.0
    tau_growth: 0.03
    margin_band: 0.01                  # EBIT-margin change yoy (fraction of revenue)
    tau_margin: 0.005
    recovery_carry: 0.5
  transition_prior: {stay: 2.0, move: 0.5}   # Dirichlet pseudo-counts per row (REGIME-TRANSITION-DIRICHLET-v1)
  min_state_support: 2.0
  market_regime_source: none           # => market regime UNAVAILABLE (MARKET-REGIME-UNAVAILABLE-v1)

estimation:                            # (Phase 3) driver distributions — DRIVER-DIST-v1 placeholders
  version: "1"
  max_history_years: 10
  min_history_years: 3
  prior_strength: 2.0                  # pseudo-observations toward profile prior
  regime_prior_strength: 2.0           # pseudo-observations toward the pooled estimate
  min_regime_support: 3.0              # effective observations per state
  min_empirical_n: 6
  student_t_df: 4
  boundary_eps: 0.001
  bootstrap_draws: 400
  persisted_param_draws: 200
  walk_forward:
    min_train_years: 3
    min_origins: 3
    quantiles: [0.1, 0.5, 0.9]
    default_spec: regime_t
    coverage_tolerance: 0.15

sensitivity:                           # (Phase 8) labeled shocks — not calibrated
  n_paths: 50
  check_seed_stability: false
  oat_driver_shocks:
    revenue_growth: 0.02
    ebit_margin: 0.01
    capex_to_revenue: 0.01
    receivables_to_revenue: 0.02
    diluted_share_growth: 0.01
  wacc_shock: 0.01
  terminal_growth_shock: 0.005
  exit_multiple_shock: 1.0
  policy_alt: historical_continuation
  posterior_tilt_state: GROWTH
  posterior_tilt: 0.15
  transition_stay_boost: 0.5
