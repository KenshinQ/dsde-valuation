# VMS-0.2 method registry (SPEC §11.1 / §19).
# Phase 4: fcff_dcf / fcfe_dcf / ddm IMPLEMENTED+enabled.
# Phase 5: pe / pb / ev_ebit / ev_ebitda / ev_sales IMPLEMENTED+enabled.
# Phase 6: residual_income / nav / sotp IMPLEMENTED+enabled.
# Phase 7: router soft-suitability + disagreement; still no calibrated ensemble.
registry_version: "vms-method-registry-0.2.phase11"
methods:
  - method_id: fcff_dcf
    version: "0.2.0"
    family: fcff_dcf
    display_name: "FCFF DCF"
    owner_module: "vms.methods.cash_flow.fcff_plugin"
    implementation_status: IMPLEMENTED
    enabled: true
    supported_targets: [FUNDAMENTAL_VALUE_CURRENT, FUNDAMENTAL_VALUE_HORIZON]
    output_basis: [EV, EQUITY, PER_SHARE]
    eligible_profiles: [MATURE_OPERATING, GROWTH_OR_REINVESTMENT_HEAVY, CYCLICAL_OPERATING, ASSET_HEAVY_OR_RESOURCE]
    exclusion_conditions:
      - "profile_in:FINANCIAL_INSTITUTION"
      - "profile_in:DISTRESSED_OR_TURNAROUND"
      - "missing_required_fields"
    required_fields: [revenue, ebit, cash_flow_from_operations, capex, total_equity, interest_bearing_debt, cash]
    quality_minimums: {critical_accounting: "PASS_OR_WARN"}
    assumption_schema_ids: [wacc_v1, terminal_growth_v1]
    failure_codes: [INELIGIBLE_PROFILE, MISSING_REQUIRED_FIELDS, WACC_G_MARGIN_FAIL, PATH_FAILURE, PATH_BUNDLE_REQUIRED]
    notes: "Phase 4 implemented; industrial FCFF not for banks by default."

  - method_id: fcfe_dcf
    version: "0.2.0"
    family: fcfe_dcf
    display_name: "FCFE DCF"
    owner_module: "vms.methods.cash_flow.fcfe_plugin"
    implementation_status: IMPLEMENTED
    enabled: true
    supported_targets: [FUNDAMENTAL_VALUE_CURRENT, FUNDAMENTAL_VALUE_HORIZON]
    output_basis: [EQUITY, PER_SHARE]
    eligible_profiles: [MATURE_OPERATING, GROWTH_OR_REINVESTMENT_HEAVY, FINANCIAL_INSTITUTION, CYCLICAL_OPERATING]
    exclusion_conditions: ["missing_required_fields", "incoherent_net_borrowing"]
    required_fields: [parent_net_income, cash_flow_from_operations, interest_bearing_debt, dividends_paid]
    quality_minimums: {critical_accounting: "PASS_OR_WARN"}
    assumption_schema_ids: [cost_of_equity_v1, terminal_growth_v1]
    failure_codes: [INELIGIBLE_PROFILE, MISSING_REQUIRED_FIELDS, KE_G_MARGIN_FAIL, PATH_FAILURE, PATH_BUNDLE_REQUIRED, WACC_SUBSTITUTION_FORBIDDEN]
    notes: "Phase 4 implemented; discounts at cost of equity; no EV bridge."

  - method_id: ddm
    version: "0.2.0"
    family: ddm
    display_name: "Dividend Discount Model"
    owner_module: "vms.methods.cash_flow.ddm_plugin"
    implementation_status: IMPLEMENTED
    enabled: true
    supported_targets: [FUNDAMENTAL_VALUE_CURRENT]
    output_basis: [EQUITY, PER_SHARE]
    eligible_profiles: [MATURE_OPERATING, FINANCIAL_INSTITUTION]
    exclusion_conditions: ["payout_not_modelable", "flag:CURRENT_FCF_NEGATIVE"]
    required_fields: [dividends_paid, parent_net_income]
    quality_minimums: {}
    assumption_schema_ids: [cost_of_equity_v1, payout_policy_v1]
    failure_codes: [INELIGIBLE_PROFILE, PAYOUT_NOT_MODELABLE, ABSENT_DIVIDENDS, ERRATIC_PAYOUT, KE_G_MARGIN_FAIL, MISSING_REQUIRED_FIELDS, PATH_FAILURE]
    notes: "Phase 4 implemented; ineligible payout returns structured reason."

  - method_id: residual_income
    version: "0.2.0"
    family: residual_income
    display_name: "Residual Income Model"
    owner_module: "vms.methods.rim"
    implementation_status: IMPLEMENTED
    enabled: true
    supported_targets: [FUNDAMENTAL_VALUE_CURRENT]
    output_basis: [EQUITY, PER_SHARE]
    eligible_profiles: [FINANCIAL_INSTITUTION, MATURE_OPERATING]
    exclusion_conditions: ["clean_surplus_unassessable", "missing_book_equity"]
    required_fields: [total_equity, parent_net_income]
    quality_minimums: {}
    assumption_schema_ids: [cost_of_equity_v1, clean_surplus_v1]
    failure_codes: [INELIGIBLE_PROFILE, CLEAN_SURPLUS_FAIL, CLEAN_SURPLUS_UNASSESSABLE, MISSING_BOOK_EQUITY, NEGATIVE_BOOK_EQUITY, MISSING_NET_INCOME_FORECAST, KE_G_MARGIN_FAIL, MISSING_REQUIRED_FIELDS, MISSING_COST_OF_EQUITY]
    notes: "Phase 6 implemented; primary for banks; clean-surplus gated."

  - method_id: pe
    version: "0.2.0"
    family: pe
    display_name: "P/E multiple"
    owner_module: "vms.methods.multiples.plugin_base"
    implementation_status: IMPLEMENTED
    enabled: true
    supported_targets: [RELATIVE_VALUE_CURRENT, MARKET_EXIT_PRICE]
    output_basis: [EQUITY, PER_SHARE, MARKET_PRICE]
    eligible_profiles: [MATURE_OPERATING, CYCLICAL_OPERATING, GROWTH_OR_REINVESTMENT_HEAVY, FINANCIAL_INSTITUTION]
    exclusion_conditions: ["negative_or_near_zero_earnings", "flag:EARNINGS_NEGATIVE_OR_UNSTABLE"]
    required_fields: [parent_net_income]
    quality_minimums: {peer_min_count: "5"}
    assumption_schema_ids: [peer_multiple_v1]
    failure_codes: [INELIGIBLE_DENOMINATOR, PEER_DATA_INSUFFICIENT, MISSING_REQUIRED_FIELDS]
    notes: "Phase 5 implemented; equity-side; negative/near-zero earnings gated."

  - method_id: pb
    version: "0.2.0"
    family: pb
    display_name: "P/B multiple"
    owner_module: "vms.methods.multiples.plugin_base"
    implementation_status: IMPLEMENTED
    enabled: true
    supported_targets: [RELATIVE_VALUE_CURRENT, MARKET_EXIT_PRICE]
    output_basis: [EQUITY, PER_SHARE, MARKET_PRICE]
    eligible_profiles: [FINANCIAL_INSTITUTION, ASSET_HEAVY_OR_RESOURCE, MATURE_OPERATING]
    exclusion_conditions: ["negative_book_equity"]
    required_fields: [total_equity]
    quality_minimums: {peer_min_count: "5"}
    assumption_schema_ids: [peer_multiple_v1]
    failure_codes: [INELIGIBLE_DENOMINATOR, PEER_DATA_INSUFFICIENT, MISSING_REQUIRED_FIELDS]
    notes: "Phase 5 implemented; equity-side; negative book equity gated."

  - method_id: ev_ebit
    version: "0.2.0"
    family: ev_ebit
    display_name: "EV/EBIT multiple"
    owner_module: "vms.methods.multiples.plugin_base"
    implementation_status: IMPLEMENTED
    enabled: true
    supported_targets: [RELATIVE_VALUE_CURRENT, MARKET_EXIT_PRICE]
    output_basis: [EV, EQUITY]
    eligible_profiles: [MATURE_OPERATING, CYCLICAL_OPERATING, GROWTH_OR_REINVESTMENT_HEAVY]
    exclusion_conditions: ["profile_in:FINANCIAL_INSTITUTION", "negative_or_near_zero_ebit"]
    required_fields: [ebit, interest_bearing_debt, cash]
    quality_minimums: {peer_min_count: "5"}
    assumption_schema_ids: [peer_multiple_v1, ev_equity_bridge_v1]
    failure_codes: [INELIGIBLE_PROFILE, INELIGIBLE_DENOMINATOR, PEER_DATA_INSUFFICIENT]
    notes: "Phase 5 implemented; EV then single bridge; banks excluded."

  - method_id: ev_ebitda
    version: "0.2.0"
    family: ev_ebitda
    display_name: "EV/EBITDA multiple"
    owner_module: "vms.methods.multiples.plugin_base"
    implementation_status: IMPLEMENTED
    enabled: true
    supported_targets: [RELATIVE_VALUE_CURRENT, MARKET_EXIT_PRICE]
    output_basis: [EV, EQUITY]
    eligible_profiles: [MATURE_OPERATING, CYCLICAL_OPERATING, ASSET_HEAVY_OR_RESOURCE]
    exclusion_conditions: ["profile_in:FINANCIAL_INSTITUTION", "negative_or_near_zero_ebitda"]
    required_fields: [ebit, depreciation_amortization, interest_bearing_debt, cash]
    quality_minimums: {peer_min_count: "5"}
    assumption_schema_ids: [peer_multiple_v1, ev_equity_bridge_v1]
    failure_codes: [INELIGIBLE_PROFILE, INELIGIBLE_DENOMINATOR, PEER_DATA_INSUFFICIENT]
    notes: "Phase 5 implemented; EV then single bridge; industrial default."

  - method_id: ev_sales
    version: "0.2.0"
    family: ev_sales
    display_name: "EV/Sales multiple"
    owner_module: "vms.methods.multiples.plugin_base"
    implementation_status: IMPLEMENTED
    enabled: true
    supported_targets: [RELATIVE_VALUE_CURRENT, MARKET_EXIT_PRICE]
    output_basis: [EV, EQUITY]
    eligible_profiles: [GROWTH_OR_REINVESTMENT_HEAVY, MATURE_OPERATING]
    exclusion_conditions: ["profile_in:FINANCIAL_INSTITUTION", "near_zero_revenue"]
    required_fields: [revenue, interest_bearing_debt, cash]
    quality_minimums: {peer_min_count: "5"}
    assumption_schema_ids: [peer_multiple_v1, ev_equity_bridge_v1]
    failure_codes: [INELIGIBLE_PROFILE, INELIGIBLE_DENOMINATOR, PEER_DATA_INSUFFICIENT]
    notes: "Phase 5 implemented; labeled RELATIVE_PRICING_ONLY; useful when earnings negative."

  - method_id: nav
    version: "0.2.0"
    family: nav
    display_name: "Net Asset Value"
    owner_module: "vms.methods.nav"
    implementation_status: IMPLEMENTED
    enabled: true
    supported_targets: [ASSET_NAV, FUNDAMENTAL_VALUE_CURRENT]
    output_basis: [NAV, EQUITY]
    eligible_profiles: [ASSET_HEAVY_OR_RESOURCE, HOLDING_OR_CONGLOMERATE, DISTRESSED_OR_TURNAROUND]
    exclusion_conditions: ["missing_asset_fair_value_inputs"]
    required_fields: [total_assets, total_liabilities]
    quality_minimums: {}
    assumption_schema_ids: [asset_haircut_v1]
    failure_codes: [MISSING_ASSET_INPUTS, EMPTY_ASSET_SCHEDULE, BOOK_AS_FAIR_UNJUSTIFIED, INELIGIBLE_PROFILE, MISSING_REQUIRED_FIELDS]
    notes: "Phase 6 implemented; book assets ≠ fair value without explicit FV lines."

  - method_id: sotp
    version: "0.2.0"
    family: sotp
    display_name: "Sum of the Parts"
    owner_module: "vms.methods.sotp"
    implementation_status: IMPLEMENTED
    enabled: true
    supported_targets: [FUNDAMENTAL_VALUE_CURRENT, ASSET_NAV, RELATIVE_VALUE_CURRENT]
    output_basis: [EQUITY, EV, NAV]
    eligible_profiles: [HOLDING_OR_CONGLOMERATE, ASSET_HEAVY_OR_RESOURCE]
    exclusion_conditions: ["missing_segment_inputs"]
    required_fields: [total_equity, interest_bearing_debt]
    quality_minimums: {}
    assumption_schema_ids: [holding_discount_v1, segment_method_v1]
    failure_codes: [MISSING_SEGMENT_INPUTS, EMPTY_SEGMENT_SCHEDULE, INTER_SEGMENT_UNRECONCILED, HOLDING_DISCOUNT_UNDECLARED_PLUG, INELIGIBLE_PROFILE, MISSING_REQUIRED_FIELDS]
    notes: "Phase 6 implemented; missing segments ⇒ data-gap / unsupported."
