[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsde-valuation"
version = "0.1.0"
description = "VMS-0.1 standalone valuation & conditional return engine (VMS-0.1 valuation & conditional return engine (Phases 0–10))"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.90",
]
hithink = [
  "requests>=2.31",
  "duckdb>=1.0",
]

[project.scripts]
vms = "vms.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
